<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🫧 Bubble Party</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow: hidden;
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: #fff;
    cursor: crosshair;
  }

  body {
    background: linear-gradient(135deg, #1a0b3d 0%, #2d1b69 30%, #6b2d8f 60%, #ff6b9d 100%);
    background-size: 400% 400%;
    animation: bgShift 20s ease infinite;
    position: relative;
  }

  @keyframes bgShift {
    0%, 100% { background-position: 0% 50%; }
    50%      { background-position: 100% 50%; }
  }

  /* Слой пузырьков */
  .bubbles {
    position: absolute;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 1;
  }

  .bubble {
    position: absolute;
    bottom: -150px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%,
                rgba(255,255,255,0.8) 0%,
                rgba(255,255,255,0.3) 15%,
                rgba(255,255,255,0.05) 40%,
                rgba(255,255,255,0) 70%);
    box-shadow:
      inset 0 0 20px rgba(255,255,255,0.3),
      0 0 10px rgba(255,255,255,0.2);
    animation: rise linear forwards;
    will-change: transform, opacity;
  }

  .bubble::before {
    content: '';
    position: absolute;
    top: 15%; left: 20%;
    width: 25%; height: 25%;
    background: rgba(255,255,255,0.7);
    border-radius: 50%;
    filter: blur(2px);
  }

  .bubble::after {
    content: '';
    position: absolute;
    bottom: 20%; right: 20%;
    width: 10%; height: 10%;
    background: rgba(255,255,255,0.5);
    border-radius: 50%;
    filter: blur(1px);
  }

  @keyframes rise {
    0%   { transform: translate(0, 0) scale(0.5); opacity: 0; }
    10%  { opacity: 1; }
    50%  { transform: translate(var(--drift, 30px), -50vh) scale(1); }
    90%  { opacity: 0.8; }
    100% { transform: translate(var(--drift-end, -20px), -120vh) scale(1.1); opacity: 0; }
  }

  /* Центральный контент */
  .content {
    position: relative;
    z-index: 10;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
  }

  .card {
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    background: rgba(255, 255, 255, 0.12);
    border: 1px solid rgba(255, 255, 255, 0.25);
    border-radius: 28px;
    padding: 50px 60px;
    max-width: 600px;
    box-shadow:
      0 20px 60px rgba(0,0,0,0.3),
      inset 0 1px 0 rgba(255,255,255,0.4);
    animation: cardIn 1.2s cubic-bezier(.2,.8,.2,1) both;
  }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(40px) scale(0.9); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  h1 {
    font-size: clamp(2.5rem, 7vw, 5rem);
    font-weight: 800;
    background: linear-gradient(90deg, #fff, #ffd6f0, #c6e4ff, #fff);
    background-size: 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shimmer 4s linear infinite;
    letter-spacing: -1px;
    margin-bottom: 15px;
  }

  @keyframes shimmer {
    to { background-position: 300% 0; }
  }

  .subtitle {
    font-size: clamp(1rem, 2.5vw, 1.3rem);
    opacity: 0.9;
    margin-bottom: 30px;
    font-weight: 300;
    letter-spacing: 0.5px;
  }

  .hint {
    display: inline-block;
    padding: 10px 22px;
    background: rgba(255,255,255,0.15);
    border-radius: 50px;
    font-size: 0.9rem;
    border: 1px solid rgba(255,255,255,0.2);
    animation: pulse 2.5s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255,255,255,0.4); }
    50%      { transform: scale(1.03); box-shadow: 0 0 30px 5px rgba(255,255,255,0.2); }
  }

  .counter {
    position: fixed;
    top: 20px; right: 20px;
    z-index: 20;
    padding: 10px 18px;
    background: rgba(0,0,0,0.3);
    backdrop-filter: blur(10px);
    border-radius: 50px;
    font-size: 0.9rem;
    border: 1px solid rgba(255,255,255,0.15);
  }

  .counter span { font-weight: 700; color: #ffd6f0; }

  /* Мини-взрыв при клике */
  .pop {
    position: absolute;
    width: 10px; height: 10px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,0.9), transparent 70%);
    pointer-events: none;
    animation: pop 0.8s ease-out forwards;
    z-index: 5;
  }

  @keyframes pop {
    0%   { transform: scale(0); opacity: 1; }
    100% { transform: scale(8); opacity: 0; }
  }

  @media (max-width: 600px) {
    .card { padding: 35px 25px; border-radius: 22px; }
    .counter { top: 10px; right: 10px; font-size: 0.8rem; padding: 8px 14px; }
  }
</style>
</head>
<body>

<div class="bubbles" id="bubbles"></div>

<div class="counter">Пузырьков лопнуто: <span id="count">0</span> 🫧</div>

<div class="content">
  <div class="card">
    <h1>Bubble Party</h1>
    <p class="subtitle">Танцующие пузыри в фиолетовых сумерках ✨</p>
    <div class="hint">👆 Кликай куда угодно — лопай пузыри!</div>
  </div>
</div>

<script>
  const bubblesLayer = document.getElementById('bubbles');
  const countEl = document.getElementById('count');
  let popped = 0;

  // Создаёт один пузырёк
  function spawnBubble(opts = {}) {
    const b = document.createElement('div');
    b.className = 'bubble';

    const size = opts.size ?? (Math.random() * 80 + 20);
    const duration = opts.duration ?? (Math.random() * 8 + 6);
    const startX = opts.x ?? Math.random() * 100;
    const drift = (Math.random() - 0.5) * 120;
    const driftEnd = (Math.random() - 0.5) * 160;

    b.style.width  = size + 'px';
    b.style.height = size + 'px';
    b.style.left   = startX + '%';
    b.style.animationDuration = duration + 's';
    b.style.setProperty('--drift', drift + 'px');
    b.style.setProperty('--drift-end', driftEnd + 'px');

    bubblesLayer.appendChild(b);

    // Удаляем после анимации
    setTimeout(() => b.remove(), duration * 1000);
  }

  // Стартовый дождь пузырьков
  for (let i = 0; i < 25; i++) {
    setTimeout(() => spawnBubble(), i * 200);
  }

  // Постоянная генерация
  setInterval(() => spawnBubble(), 400);

  // Клик — взрыв пузырьков
  document.addEventListener('click', (e) => {
    // Визуальный "поп"
    const pop = document.createElement('div');
    pop.className = 'pop';
    pop.style.left = (e.clientX - 5) + 'px';
    pop.style.top  = (e.clientY - 5) + 'px';
    document.body.appendChild(pop);
    setTimeout(() => pop.remove(), 800);

    // Россыпь новых пузырьков из точки клика
    for (let i = 0; i < 8; i++) {
      spawnBubble({
        size: Math.random() * 40 + 15,
        duration: Math.random() * 4 + 3,
        x: (e.clientX / window.innerWidth) * 100 + (Math.random() - 0.5) * 10
      });
    }

    popped++;
    countEl.textContent = popped;
  });

  // Движение мыши — лёгкий след
  let lastTrail = 0;
  document.addEventListener('mousemove', (e) => {
    const now = Date.now();
    if (now - lastTrail < 80) return;
    lastTrail = now;
    if (Math.random() > 0.4) return;
    spawnBubble({
      size: Math.random() * 25 + 8,
      duration: Math.random() * 3 + 2,
      x: (e.clientX / window.innerWidth) * 100
    });
  });
</script>

</body>
</html>
